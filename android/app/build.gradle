plugins {
    id 'com.android.application'
}

android {
    namespace 'com.runzhammer.tankblaster.android'
    compileSdk 36

	defaultConfig {
		applicationId 'com.runzhammer.tankblaster'
		minSdk 23
		targetSdk 36
		versionCode 2
		versionName '0.1.1'
	}

	signingConfigs {
		release {
			storeFile signingConfigs.debug.storeFile
			storePassword signingConfigs.debug.storePassword
			keyAlias signingConfigs.debug.keyAlias
			keyPassword signingConfigs.debug.keyPassword
		}
	}

	buildTypes {
		release {
			signingConfig signingConfigs.release
		}
	}

	lint {
		checkReleaseBuilds false
	}
}

dependencies {
    implementation files('libs/tankblaster.aar')
}
