plugins {
    id 'com.android.application'
}

def versionFile = rootProject.file('../VERSION')
def tankblasterVersionName = versionFile.exists() ? versionFile.text.trim() : 'dev'
def tankblasterVersionCode = (project.findProperty('tankblasterVersionCode') ?: '1') as Integer

android {
    namespace 'com.runzhammer.tankblaster.android'
    compileSdk 36

	defaultConfig {
		applicationId 'com.runzhammer.tankblaster'
		minSdk 23
		targetSdk 36
		versionCode tankblasterVersionCode
		versionName tankblasterVersionName
	}

	signingConfigs {
		release {
			storeFile signingConfigs.debug.storeFile
			storePassword signingConfigs.debug.storePassword
			keyAlias signingConfigs.debug.keyAlias
			keyPassword signingConfigs.debug.keyPassword
		}
	}

	buildTypes {
		release {
			signingConfig signingConfigs.release
		}
	}

	lint {
		checkReleaseBuilds false
	}
}

dependencies {
    implementation files('libs/tankblaster.aar')
}
