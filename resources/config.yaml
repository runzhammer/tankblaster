window:
  width: 1024
  height: 768
tanks:
  count: 2
gameplay:
  spawn_landing_pause_seconds: 1
  impact_pause_seconds: 1
  tank_hit_pause_seconds: 0.6
  palm_hit_pause_seconds: 2
  projectile_reentry: 1
  palm_count: -1
  cloud_aggression: 10
  quick_round_start: true
  palms:
    min_count: 1
    max_count: 0
  clouds:
    min_count: 1
    max_count: 2
    min_speed: 0.05
    max_speed: 0.13
debug:
  enabled: false
  start_scene: game # game / shop
  start_shop: false
  # Optional im Debug-Modus: leere/fehlende Liste erlaubt alle Todesanimationen.
  # Erlaubte Namen:
  # - dust
  # - explosion
  # - mushroom
  # - smoke
  # - grenade_impact
  # - large_grenade_impact
  # - atom_impact
  # - scatter_projectiles
  zero_power_animations: []
  game:
    rounds: 10
    players: *human_players
online:
  server_url: "ws://127.0.0.1:8765/game"
