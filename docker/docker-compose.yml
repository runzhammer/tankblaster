services:
  tankblaster-server:
    build:
      context: ..
      dockerfile: docker/server.Dockerfile
    image: ${TANKBLASTER_SERVER_IMAGE:-tankblaster-server:latest}
    container_name: ${TANKBLASTER_SERVER_CONTAINER:-tankblaster-server}
    restart: unless-stopped
    ports:
      - "${TANKBLASTER_SERVER_PORT:-8765}:8765"
    environment:
      TANKBLASTER_SERVER_ADDRESS: "0.0.0.0:8765"
      TANKBLASTER_SERVER_PUBLIC_URL: "${TANKBLASTER_SERVER_PUBLIC_URL:-http://127.0.0.1:8765}"
      TANKBLASTER_SERVER_DB: "/data/tankblaster.db"
    volumes:
      - tankblaster-data:/data
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: ${TANKBLASTER_SERVER_MEM_LIMIT:-256m}
    cpus: ${TANKBLASTER_SERVER_CPUS:-1.0}

volumes:
  tankblaster-data:
